<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📁 DRS Decision Records -- Royal Gold & Indigo Theme</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1e1b4b;
      --surface: #312e81;
      --card: rgba(49, 46, 129, 0.85);
      --card-border: rgba(250, 204, 21, 0.35);
      --gold: #facc15;
      --accent: #c084fc;
      --text: #faf5ff;
      --muted: #e9d5ff;
      --radius: 18px;
    }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: radial-gradient(circle at 50% 0%, #3730a3 0%, #1e1b4b 100%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 3rem;
    }

    header {
      background: rgba(49, 46, 129, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      padding: 1.2rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 1.2rem; cursor: pointer; }
    .graphic-logo {
      width: 50px;
      height: 50px;
      filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.8));
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 900;
      background: linear-gradient(90deg, #facc15, #e879f9, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 0.45rem 0.9rem;
      border-radius: 10px;
      transition: all 0.2s;
    }
    .nav-link.active, .nav-link:hover { color: var(--gold); background: rgba(250, 204, 21, 0.2); }

    .container { max-width: 1250px; margin: 2rem auto; padding: 0 1.5rem; }

    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.2rem 1.8rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .search-input {
      padding: 0.7rem 1.2rem;
      background: rgba(30, 27, 75, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      width: 340px;
    }
    .btn-export {
      padding: 0.7rem 1.4rem;
      background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
      color: #030712;
      font-weight: 900;
      font-size: 0.9rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(250, 204, 21, 0.4);
    }

    .table-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.92rem; }
    th, td { padding: 1.1rem 1.3rem; border-bottom: 1px solid var(--card-border); }
    th { background: rgba(30, 27, 75, 0.95); color: var(--gold); font-weight: 900; text-transform: uppercase; font-size: 0.78rem; letter-spacing: 0.08em; }
    tr:hover { background: rgba(250, 204, 21, 0.08); }

    .badge-out { padding: 0.3rem 0.7rem; border-radius: 99px; background: rgba(239, 68, 68, 0.25); color: #fca5a5; font-weight: 900; font-size: 0.78rem; }
    .badge-notout { padding: 0.3rem 0.7rem; border-radius: 99px; background: rgba(34, 197, 94, 0.25); color: #86efac; font-weight: 900; font-size: 0.78rem; }
    .badge-umpire { padding: 0.3rem 0.7rem; border-radius: 99px; background: rgba(250, 204, 21, 0.25); color: #fde047; font-weight: 900; font-size: 0.78rem; }

    .media-btn { color: var(--gold); text-decoration: none; font-weight: 700; font-size: 0.85rem; }
  </style>
</head>
<body>

<header>
  <div class="header-left" onclick="window.location.href='/'">
    <div class="graphic-logo">
      <svg viewBox="0 0 100 100" width="50" height="50">
        <rect x="25" y="15" width="50" height="70" rx="8" fill="none" stroke="#facc15" stroke-width="4"/>
        <path d="M35 35 L65 35 M35 50 L65 50 M35 65 L55 65" stroke="#e879f9" stroke-width="4" stroke-linecap="round"/>
        <circle cx="70" cy="70" r="12" fill="#facc15"/>
      </svg>
    </div>
    <div>
      <h1>DRS Decision Records Console</h1>
      <p>Page 3 -- Royal Imperial Gold & Indigo · Match History Database · CSV Export</p>
    </div>
  </div>
  <div style="display:flex; gap:0.6rem; align-items:center;">
    <a href="/" class="nav-link">📹 DRS Review</a>
    <a href="/analytics" class="nav-link">📊 Precision Matrix</a>
    <a href="/records" class="nav-link active">📁 Decision Records</a>
    <a href="/admin" class="nav-link">⚡ Admin Console</a>
  </div>
</header>

<div class="container">
  <div class="control-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search Job ID or Verdict..." onkeyup="filterTable()" />
    <button class="btn-export" onclick="exportCSV()">📥 Export CSV Records</button>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Job ID</th>
          <th>Timestamp (UTC)</th>
          <th>Ball Format</th>
          <th>Pitching Zone</th>
          <th>Impact Zone</th>
          <th>Wicket Verdict</th>
          <th>Final Call</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="recordsBody">
        <tr><td colspan="8" style="text-align:center; color:var(--muted)">Loading decision records...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  let allRecords = [];
  async function loadRecords() {
    try {
      const res = await fetch('/api/history');
      const data = await res.json();
      allRecords = data.decisions || [];
      renderTable(allRecords);
    } catch (err) {
      console.error(err);
    }
  }

  function renderTable(records) {
    const tbody = document.getElementById('recordsBody');
    if (!records || records.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:var(--muted)">No decision reviews recorded yet.</td></tr>';
      return;
    }
    tbody.innerHTML = records.map(r => {
      let fc = r.final_call || 'NOT OUT';
      let badgeClass = fc === 'OUT' ? 'badge-out' : fc === 'NOT OUT' ? 'badge-notout' : 'badge-umpire';
      return `
        <tr>
          <td style="font-family:monospace; font-weight:900; color:var(--gold)">${(r.job_id || '').substring(0, 8)}...</td>
          <td>${r.timestamp ? r.timestamp.substring(0, 19).replace('T', ' ') : '—'}</td>
          <td><span style="text-transform:uppercase; font-size:0.75rem; font-weight:900; color:var(--accent)">${r.color || 'RED'}</span></td>
          <td>${(r.pitching_zone || 'IN_LINE').replace(/_/g, ' ')}</td>
          <td>${(r.impact_zone || 'IN_LINE').replace(/_/g, ' ')}</td>
          <td>${(r.wicket_verdict || 'HITTING').replace(/_/g, ' ')}</td>
          <td><span class="${badgeClass}">${fc}</span></td>
          <td>
            <a href="/outputs/${r.job_id}/tracked_output.mp4" target="_blank" class="media-btn">📹 Video</a> | 
            <a href="/outputs/${r.job_id}/drs_decision.png" target="_blank" class="media-btn">📊 Graphic</a>
          </td>
        </tr>
      `;
    }).join('');
  }

  function filterTable() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allRecords.filter(r => 
      (r.job_id && r.job_id.toLowerCase().includes(q)) ||
      (r.final_call && r.final_call.toLowerCase().includes(q))
    );
    renderTable(filtered);
  }

  function exportCSV() {
    if (!allRecords.length) return alert("No records to export.");
    let csv = "Job ID,Timestamp,Color,Pitching Zone,Impact Zone,Wicket Verdict,Final Call\n";
    allRecords.forEach(r => {
      csv += `"${r.job_id}","${r.timestamp}","${r.color}","${r.pitching_zone}","${r.impact_zone}","${r.wicket_verdict}","${r.final_call}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `drs_decision_records_${Date.now()}.csv`;
    a.click();
  }
  loadRecords();
</script>

</body>
</html>
